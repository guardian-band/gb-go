services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DB_HOST: opengauss
      DB_PORT: 5432
      DB_USER: gaussdb
      DB_PASSWORD: ChangeMe123
      DB_NAME: opengauss
      DB_SSLMODE: disable
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: guardianband-files
      S3_USE_SSL: "false"
    depends_on:
      - opengauss
      - minio

  opengauss:
    image: opengauss/opengauss:latest
    environment:
      GS_PASSWORD: ChangeMe123
    ports:
      - "5432:5432"
    volumes:
      - opengauss-data:/var/lib/opengauss/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  opengauss-data:
  minio-data:

