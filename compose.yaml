services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DB_HOST: opengauss
      DB_PORT: 5432
      DB_USER: gaussdb
      DB_PASSWORD: ${DB_PASSWORD:-ChangeMe@123}
      DB_NAME: guardianband
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ChangeMeRedis123}
      REDIS_DB: 0
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: guardianband-files
      S3_USE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-ChangeMeJWTSecret123}
      AI_BASE_URL: http://polypharmacy-ai:8000
      AI_REQUEST_TIMEOUT: 5s
    depends_on:
      opengauss:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      polypharmacy-ai:
        condition: service_started

  polypharmacy-ai:
    build:
      context: ../ai
      dockerfile: Dockerfile
    expose:
      - "8000"
    volumes:
      - ../ai/model-release:/models:ro
    environment:
      POLYPHARMACY_RUNTIME: "onnx"
      POLYPHARMACY_DEVICE: "cpu"
      POLYPHARMACY_CPU_THREADS: "1"
      POLYPHARMACY_MAX_TOP_K: "20"
      POLYPHARMACY_EXPERIMENT_PATH: /models/teacher.yaml
      POLYPHARMACY_MANIFEST_PATH: /models/benchmark/manifest.json
      POLYPHARMACY_CHECKPOINT_PATH: /models/checkpoint_best.pt
      POLYPHARMACY_SELECTION_PATH: /models/teacher_validation_selection.json
      POLYPHARMACY_ONNX_FUSED_PATH: /models/onnx/teacher_fused.onnx
      POLYPHARMACY_ONNX_BASELINE_PATH: /models/onnx/teacher_baseline.onnx
      POLYPHARMACY_ONNX_RELEASE_PATH: /models/onnx/onnx_release.json
      POLYPHARMACY_CHECKPOINT_SHA256: 1288c4bb7e601c42b615ccc99f9ced4afa86f6416db0db37276817b7b1a5e39a
      POLYPHARMACY_SELECTION_SHA256: 71d0893f573e5266caaada0836d13ab73c6fcabd64a53777b4dad4497bf8d61a
      POLYPHARMACY_FEATURE_SHA256: e0c316825f665da98371185f08cdac2a742ebd5f257bf6465f7c4fc93eaee111
      POLYPHARMACY_HIERARCHY_SHA256: 61632bfffb8230624307534148a548e784bc79704d63b0a3b6bfe7d8696138f0
    restart: unless-stopped

  opengauss:
    image: opengauss/opengauss-server:latest
    privileged: true
    environment:
      GS_PASSWORD: ${DB_PASSWORD:-ChangeMe@123}
      GS_DB: guardianband
    ports:
      - "5432:5432"
    volumes:
      - opengauss-data:/var/lib/opengauss
    healthcheck:
      test: ["CMD-SHELL", "LD_LIBRARY_PATH=/usr/local/opengauss/lib /usr/local/opengauss/bin/gsql -d guardianband -U gaussdb -W \"$$GS_PASSWORD\" -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:-ChangeMeRedis123}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ChangeMeRedis123}
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  opengauss-data:
  redis-data:
  minio-data:
