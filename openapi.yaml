openapi: 3.0.3
info:
  title: Guardian Band API
  description: HTTP API for the Guardian Band application.
  version: 0.1.0

servers:
  - url: http://localhost:3000
    description: Local development server

paths:
  /api/register:
    post:
      summary: Register a user
      operationId: registerUser
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '201':
          description: User successfully registered
        '400':
          description: Invalid request
        '409':
          description: User already exists
        '500':
          description: Internal server error

  /api/login:
    post:
      summary: Log in a user
      operationId: loginUser
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: User successfully logged in
        '400':
          description: Invalid request
        '401':
          description: Invalid credentials

components:
  schemas:
    AuthRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: ahmet
        password:
          type: string
          format: password
          example: 123456

