openapi: 3.0.3
info:
  title: Guardian Band API
  description: HTTP API for the Guardian Band application.
  version: 0.1.0

servers:
  - url: http://localhost:3000
    description: Local development server

paths:
  /api/register:
    post:
      summary: Register a user
      operationId: registerUser
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Invalid request
        '409':
          description: User already exists
        '500':
          description: Internal server error

  /api/login:
    post:
      summary: Log in a user
      operationId: loginUser
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: User successfully logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request
        '401':
          description: Invalid credentials

  /api/protected:
    get:
      summary: Sample protected endpoint requiring JWT
      operationId: getProtected
      tags:
        - Protected
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Access granted
          content:
            text/plain:
              schema:
                type: string
                example: Access granted to protected endpoint!
        '401':
          description: Missing, invalid, or expired JWT token

  /api/upload:
    post:
      summary: Upload a file to S3 / MinIO storage
      operationId: uploadFile
      tags:
        - Storage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          description: Invalid request or missing file
        '401':
          description: Missing, invalid, or expired JWT token
        '500':
          description: Internal server error or storage failure

  /api/vitals:
    post:
      summary: Store a vital packet in Redis Stream and Cache
      operationId: storeVitals
      tags:
        - Vitals
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VitalPacket'
      responses:
        '201':
          description: Vitals successfully recorded
        '400':
          description: Invalid vital data range or invalid payload
        '401':
          description: Missing, invalid, or expired JWT token
        '403':
          description: Forbidden - device does not belong to the patient
        '500':
          description: Internal server error

  /api/vitals/{userId}/latest:
    get:
      summary: Retrieve the latest vitals record for a user
      operationId: getLatestVitals
      tags:
        - Vitals
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Vitals successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VitalPacket'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized access (missing or invalid JWT token)
        '404':
          description: Patient not found or unauthorized access (hidden status)
        '500':
          description: Internal server error or storage failure

  /api/profile:
    get:
      summary: Get the authenticated user's patient profile
      operationId: getProfile
      tags:
        - Profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientProfile'
        '401':
          description: Missing, invalid, or expired JWT token
        '404':
          description: Profile not found for this user
        '500':
          description: Internal server error
    put:
      summary: Create or update the authenticated user's patient profile
      operationId: putProfile
      tags:
        - Profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientProfile'
      responses:
        '200':
          description: Profile successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientProfile'
        '400':
          description: Invalid request or payload validations failed
        '401':
          description: Missing, invalid, or expired JWT token
        '500':
          description: Internal server error

  /api/documents:
    get:
      summary: Get the authenticated user's document catalog list
      operationId: getDocuments
      tags:
        - Documents
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of documents successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentCatalog'
        '401':
          description: Missing, invalid, or expired JWT token
        '500':
          description: Internal server error
    post:
      summary: Create a new document in catalog and upload file to S3
      operationId: createDocument
      tags:
        - Documents
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Document file (PDF, JPEG, PNG, max 10MB)
                kind:
                  type: string
                  enum: [report, prescription]
                  description: Kind of document
                title:
                  type: string
                  description: Title of the document
              required: [file, kind, title]
      responses:
        '201':
          description: Document successfully created and uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  objectKey:
                    type: string
                  versionId:
                    type: string
                  message:
                    type: string
        '400':
          description: Invalid request body, oversize file, or unsupported file format
        '401':
          description: Missing, invalid, or expired JWT token
        '500':
          description: Internal server error or storage failure

  /api/documents/{documentId}:
    get:
      summary: Get detailed catalog metadata for a specific document
      operationId: getDocumentDetail
      tags:
        - Documents
      security:
        - BearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document catalog details successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentCatalog'
        '401':
          description: Missing, invalid, or expired JWT token
        '403':
          description: Forbidden - document does not belong to the user
        '404':
          description: Document not found
        '500':
          description: Internal server error

  /api/documents/{documentId}/content:
    get:
      summary: Stream authorized document content from S3
      operationId: getDocumentContent
      tags:
        - Documents
      security:
        - BearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document stream successfully retrieved
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '401':
          description: Missing, invalid, or expired JWT token
        '403':
          description: Forbidden - document does not belong to the user
        '404':
          description: Document not found
        '500':
          description: Internal server error
    put:
      summary: Update the content of an existing document
      operationId: updateDocumentContent
      tags:
        - Documents
      security:
        - BearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Document file (PDF, JPEG, PNG, max 10MB)
              required: [file]
      responses:
        '200':
          description: Document content successfully updated
        '400':
          description: Invalid request body, oversize file, or unsupported file format
        '401':
          description: Missing, invalid, or expired JWT token
        '403':
          description: Forbidden - document does not belong to the user
        '404':
          description: Document not found
        '500':
          description: Internal server error

  /api/medication-catalog:
    get:
      summary: Retrieve list of common medications in the catalog
      operationId: getMedicationCatalog
      tags:
        - Medications
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Medication catalog list successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MedicationCatalogItem'
        '401':
          description: Missing or invalid token
        '500':
          description: Internal server error

  /api/medications:
    get:
      summary: Retrieve the patient's active medication plans
      operationId: getMedications
      tags:
        - Medications
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active medication plans successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MedicationResponse'
        '401':
          description: Missing or invalid token
        '500':
          description: Internal server error
    post:
      summary: Create a new medication plan for the patient
      operationId: createMedicationPlan
      tags:
        - Medications
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMedicationRequest'
      responses:
        '201':
          description: Medication plan successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicationResponse'
        '400':
          description: Invalid inputs or missing prescription reference
        '401':
          description: Missing or invalid token
        '403':
          description: Forbidden - prescription document belongs to another user
        '500':
          description: Internal server error

  /api/medications/{medicationId}/taken:
    post:
      summary: Record that a dose has been taken now
      operationId: takeMedicationDose
      tags:
        - Medications
      security:
        - BearerAuth: []
      parameters:
        - name: medicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dose successfully recorded and next schedule returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TakenResponse'
        '401':
          description: Missing or invalid token
        '403':
          description: Forbidden - medication plan does not belong to the user
        '404':
          description: Active medication plan not found
        '500':
          description: Internal server error

  /api/sos/incidents:
    post:
      summary: Trigger a new SOS incident and alert emergency contacts
      operationId: postSOSIncident
      tags:
        - SOS
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SOSIncidentRequest'
      responses:
        '201':
          description: SOS incident successfully created and alerts sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SOSIncidentResponse'
        '400':
          description: Invalid request payload or coordinates validation failed
        '401':
          description: Missing, invalid, or expired JWT token
        '500':
          description: Internal server error

  /api/sos/incidents/{incidentId}/all-clear:
    post:
      summary: Process an all-clear signal for the active SOS incident
      operationId: allClearSOSIncident
      tags:
        - SOS
      security:
        - BearerAuth: []
      parameters:
        - name: incidentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: All clear processed successfully and notification sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SOSAllClearResponse'
        '401':
          description: Missing, invalid, or expired JWT token
        '403':
          description: Forbidden - SOS incident belongs to another user
        '404':
          description: SOS incident not found
        '500':
          description: Internal server error

  /api/notification-endpoints/{endpointId}:
    put:
      summary: Register or update a notification endpoint
      operationId: putNotificationEndpoint
      tags:
        - Notifications
      security:
        - BearerAuth: []
      parameters:
        - name: endpointId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - channel
                - token
              properties:
                channel:
                  type: string
                  enum: [push, sms]
                  example: "push"
                token:
                  type: string
                  example: "device-token-123"
      responses:
        '200':
          description: Notification endpoint successfully registered or updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  channel:
                    type: string
                  token:
                    type: string
                  active:
                    type: boolean
                  updatedAt:
                    type: string
                    format: date-time
        '400':
          description: Invalid request parameters or body
        '401':
          description: Missing, invalid, or expired JWT token
        '403':
          description: Forbidden - endpoint belongs to another user
        '500':
          description: Internal server error
    delete:
      summary: Remove a notification endpoint registration
      operationId: deleteNotificationEndpoint
      tags:
        - Notifications
      security:
        - BearerAuth: []
      parameters:
        - name: endpointId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Notification endpoint successfully deleted
        '401':
          description: Missing, invalid, or expired JWT token
        '403':
          description: Forbidden - endpoint belongs to another user
        '404':
          description: Notification endpoint not found
        '500':
          description: Internal server error

  /api/emergency-access/tokens:
    post:
      summary: Generate a short-lived QR access token for the patient
      operationId: createEmergencyAccessToken
      tags:
        - Emergency Access
      security:
        - BearerAuth: []
      responses:
        '201':
          description: QR token successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "4d7c83ba9a8c7b8d8f9e0a1b2c3d4e5f"
                  expiresAt:
                    type: string
                    format: date-time
        '401':
          description: Missing, invalid, or expired JWT token
        '500':
          description: Internal server error

  /api/emergency-access/redeem:
    post:
      summary: Redeem patient QR token to establish emergency session
      operationId: redeemEmergencyToken
      tags:
        - Emergency Access
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  example: "4d7c83ba9a8c7b8d8f9e0a1b2c3d4e5f"
      responses:
        '200':
          description: Token redeemed successfully and session established
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                    format: uuid
                  expiresAt:
                    type: string
                    format: date-time
        '400':
          description: Invalid or expired token
        '401':
          description: Missing, invalid, or expired JWT token
        '500':
          description: Internal server error

  /api/emergency-access/sessions/{sessionId}/medical-card:
    get:
      summary: Retrieve patient emergency medical card for active session
      operationId: getEmergencyMedicalCard
      tags:
        - Emergency Access
      security:
        - BearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Medical card retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyMedicalCard'
        '401':
          description: Missing, invalid, or expired JWT token
        '403':
          description: Forbidden - session expired, revoked, or responder mismatch
        '404':
          description: Session not found
        '500':
          description: Internal server error

  /api/emergency-access/sessions/{sessionId}:
    delete:
      summary: Revoke emergency access session (patient only)
      operationId: revokeEmergencySession
      tags:
        - Emergency Access
      security:
        - BearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session successfully revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "emergency access session revoked successfully"
        '401':
          description: Missing, invalid, or expired JWT token
        '403':
          description: Forbidden - patient mismatch
        '404':
          description: Session not found
        '500':
          description: Internal server error

  /api/patient-links:
    get:
      summary: Get patient links
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
    post:
      summary: Create patient link
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                displayName:
                  type: string
                relationship:
                  type: string
                kind:
                  type: string
                canMonitor:
                  type: boolean
                isEmergencyContact:
                  type: boolean
                isPrimary:
                  type: boolean
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '409':
          description: Conflict
  /api/patient-links/{linkId}:
    patch:
      summary: Update patient link
      security:
        - bearerAuth: []
      parameters:
        - name: linkId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
    delete:
      summary: Delete patient link
      security:
        - bearerAuth: []
      parameters:
        - name: linkId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthRequest:
      type: object
      required:
        - phoneNumber
        - password
      properties:
        phoneNumber:
          type: string
          description: E.164 biçimindeki telefon numarası
          example: "+905551234567"
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    UploadResponse:
      type: object
      properties:
        file_key:
          type: string
          example: 4a2b9f80-1234-5678-9abc-def012345678.png
        message:
          type: string
          example: file uploaded successfully

    RegisterRequest:
      type: object
      required:
        - phoneNumber
        - password
      properties:
        phoneNumber:
          type: string
          description: E.164 biçimindeki telefon numarası
          example: "+905551234567"
        password:
          type: string
          format: password
          minLength: 8
          example: secure-password

    RegisterResponse:
      type: object
      required:
        - id
        - phoneNumber
      properties:
        id:
          type: string
        phoneNumber:
          type: string

    VitalPacket:
      type: object
      required:
        - recordedAt
      properties:
        userId:
          type: string
          nullable: true
        heartRate:
          type: integer
          description: Kalp atış hızı (bpm)
          example: 72
        bloodOxygen:
          type: integer
          description: Kandaki oksijen oranı (SpO₂ yüzdesi)
          example: 98
        recordedAt:
          type: string
          format: date-time
        deviceSn:
          type: string
          example: "band-xyz-123"
        readingId:
          type: string
          example: "read-999"

    PatientProfile:
      type: object
      properties:
        birthDate:
          type: string
          format: date
          example: "1995-04-12"
        bloodType:
          type: string
          example: "A+"
        criticalFacts:
          type: object
          additionalProperties: true
          example:
            allergies:
              - penicillin
            chronicConditions:
              - asthma
        timezone:
          type: string
          example: "Europe/Istanbul"

    DocumentCatalog:
      type: object
      required:
        - id
        - kind
        - title
        - contentType
        - currentVersionId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [report, prescription]
        title:
          type: string
          example: "Kan Analiz Raporu"
        contentType:
          type: string
          example: "application/pdf"
        currentVersionId:
          type: string
          example: "v1.0"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MedicationCatalogItem:
      type: object
      required:
        - id
        - name
        - strength
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Parol"
        strength:
          type: string
          example: "500mg"

    CreateMedicationRequest:
      type: object
      required:
        - name
        - frequencyHours
      properties:
        name:
          type: string
          example: "Parol"
        strength:
          type: string
          example: "500mg"
        instructions:
          type: string
          example: "Günde 2 kez aç karnına"
        frequencyHours:
          type: integer
          enum: [6, 12, 24]
          example: 12
        prescriptionDocumentId:
          type: string
          format: uuid
          nullable: true

    MedicationResponse:
      type: object
      required:
        - id
        - name
        - frequencyHours
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        strength:
          type: string
        instructions:
          type: string
        frequencyHours:
          type: integer
        lastTakenAt:
          type: string
          format: date-time
          nullable: true
        nextScheduledFor:
          type: string
          format: date-time
          nullable: true

    TakenResponse:
      type: object
      required:
        - nextScheduledFor
      properties:
        nextScheduledFor:
          type: string
          format: date-time

    SOSIncidentRequest:
      type: object
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 41.0082
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 28.9784
        accuracyMeters:
          type: number
          format: double
          minimum: 0
          example: 15.5
        address:
          type: string
          example: "İstanbul, Türkiye"

    SOSIncidentResponse:
      type: object
      required:
        - id
        - patientId
        - status
        - startedAt
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        status:
          type: string
          example: "active"
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        accuracyMeters:
          type: number
          format: double
          nullable: true
        address:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time

    SOSAllClearResponse:
      type: object
      required:
        - id
        - status
        - allClearAt
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          example: "active"
        allClearAt:
          type: string
          format: date-time
          nullable: true

    EmergencyMedicalCard:
      type: object
      required:
        - bloodType
        - criticalFacts
        - medications
      properties:
        bloodType:
          type: string
          example: "A+"
        criticalFacts:
          type: object
          example: {"allergies": ["Penicillin"]}
        medications:
          type: array
          items:
            $ref: '#/components/schemas/EmergencyMedication'
        latestVitals:
          $ref: '#/components/schemas/EmergencyLatestVitals'
          nullable: true

    EmergencyMedication:
      type: object
      required:
        - name
        - strength
        - instructions
      properties:
        name:
          type: string
          example: "Aspirin"
        strength:
          type: string
          example: "100mg"
        instructions:
          type: string
          example: "Take once daily"

    EmergencyLatestVitals:
      type: object
      required:
        - heartRate
        - bloodOxygen
        - recordedAt
      properties:
        heartRate:
          type: integer
          example: 72
        bloodOxygen:
          type: integer
          example: 98
        recordedAt:
          type: string
          format: date-time



