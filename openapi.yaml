openapi: 3.0.3
info:
  title: Guardian Band API
  description: HTTP API for the Guardian Band application.
  version: 0.1.0

servers:
  - url: http://localhost:3000
    description: Local development server

paths:
  /api/register:
    post:
      summary: Register a user
      operationId: registerUser
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Invalid request
        '409':
          description: User already exists
        '500':
          description: Internal server error

  /api/login:
    post:
      summary: Log in a user
      operationId: loginUser
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: User successfully logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request
        '401':
          description: Invalid credentials

  /api/protected:
    get:
      summary: Sample protected endpoint requiring JWT
      operationId: getProtected
      tags:
        - Protected
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Access granted
          content:
            text/plain:
              schema:
                type: string
                example: Access granted to protected endpoint!
        '401':
          description: Missing, invalid, or expired JWT token

  /api/upload:
    post:
      summary: Upload a file to S3 / MinIO storage
      operationId: uploadFile
      tags:
        - Storage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          description: Invalid request or missing file
        '401':
          description: Missing, invalid, or expired JWT token
        '500':
          description: Internal server error or storage failure

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: ahmet
        password:
          type: string
          format: password
          example: 123456

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    UploadResponse:
      type: object
      properties:
        file_key:
          type: string
          example: 4a2b9f80-1234-5678-9abc-def012345678.png
        message:
          type: string
          example: file uploaded successfully

    RegisterRequest:
      type: object
      required:
        - phoneNumber
        - password
      properties:
        phoneNumber:
          type: string
          description: E.164 biçimindeki telefon numarası
          example: "+905551234567"
        password:
          type: string
          format: password
          minLength: 8
          example: secure-password

    RegisterResponse:
      type: object
      required:
        - id
        - phoneNumber
      properties:
        id:
          type: string
        phoneNumber:
          type: string



