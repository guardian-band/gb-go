openapi: 3.0.3
info:
  title: Guardian Band API
  description: HTTP API for the Guardian Band application.
  version: 0.1.0

servers:
  - url: http://localhost:3000
    description: Local development server

paths:
  /api/register:
    post:
      summary: Register a user
      operationId: registerUser
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Invalid request
        '409':
          description: User already exists
        '500':
          description: Internal server error

  /api/login:
    post:
      summary: Log in a user
      operationId: loginUser
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: User successfully logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request
        '401':
          description: Invalid credentials

  /api/protected:
    get:
      summary: Sample protected endpoint requiring JWT
      operationId: getProtected
      tags:
        - Protected
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Access granted
          content:
            text/plain:
              schema:
                type: string
                example: Access granted to protected endpoint!
        '401':
          description: Missing, invalid, or expired JWT token

  /api/upload:
    post:
      summary: Upload a file to S3 / MinIO storage
      operationId: uploadFile
      tags:
        - Storage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          description: Invalid request or missing file
        '401':
          description: Missing, invalid, or expired JWT token
        '500':
          description: Internal server error or storage failure

  /api/vitals:
    post:
      summary: Store a vital packet in Redis Stream and Cache
      operationId: storeVitals
      tags:
        - Vitals
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VitalPacket'
      responses:
        '201':
          description: Vitals successfully recorded
        '400':
          description: Invalid vital data range or invalid payload
        '401':
          description: Missing, invalid, or expired JWT token
        '403':
          description: Forbidden - device does not belong to the patient
        '500':
          description: Internal server error

  /api/vitals/{userId}/latest:
    get:
      summary: Retrieve the latest vitals record for a user
      operationId: getLatestVitals
      tags:
        - Vitals
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Vitals successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VitalPacket'
        '400':
          description: Invalid request
        '404':
          description: Vitals not found for this user
        '500':
          description: Internal server error or storage failure

  /api/profile:
    get:
      summary: Get the authenticated user's patient profile
      operationId: getProfile
      tags:
        - Profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientProfile'
        '401':
          description: Missing, invalid, or expired JWT token
        '404':
          description: Profile not found for this user
        '500':
          description: Internal server error
    put:
      summary: Create or update the authenticated user's patient profile
      operationId: putProfile
      tags:
        - Profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientProfile'
      responses:
        '200':
          description: Profile successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientProfile'
        '400':
          description: Invalid request or payload validations failed
        '401':
          description: Missing, invalid, or expired JWT token
        '500':
          description: Internal server error

  /api/documents:
    get:
      summary: Get the authenticated user's document catalog list
      operationId: getDocuments
      tags:
        - Documents
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of documents successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentCatalog'
        '401':
          description: Missing, invalid, or expired JWT token
        '500':
          description: Internal server error

  /api/documents/{documentId}:
    get:
      summary: Get detailed catalog metadata for a specific document
      operationId: getDocumentDetail
      tags:
        - Documents
      security:
        - BearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document catalog details successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentCatalog'
        '401':
          description: Missing, invalid, or expired JWT token
        '403':
          description: Forbidden - document does not belong to the user
        '404':
          description: Document not found
        '500':
          description: Internal server error

  /api/medication-catalog:
    get:
      summary: Retrieve list of common medications in the catalog
      operationId: getMedicationCatalog
      tags:
        - Medications
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Medication catalog list successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MedicationCatalogItem'
        '401':
          description: Missing or invalid token
        '500':
          description: Internal server error

  /api/medications:
    get:
      summary: Retrieve the patient's active medication plans
      operationId: getMedications
      tags:
        - Medications
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active medication plans successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MedicationResponse'
        '401':
          description: Missing or invalid token
        '500':
          description: Internal server error
    post:
      summary: Create a new medication plan for the patient
      operationId: createMedicationPlan
      tags:
        - Medications
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMedicationRequest'
      responses:
        '201':
          description: Medication plan successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicationResponse'
        '400':
          description: Invalid inputs or missing prescription reference
        '401':
          description: Missing or invalid token
        '403':
          description: Forbidden - prescription document belongs to another user
        '500':
          description: Internal server error

  /api/medications/{medicationId}/taken:
    post:
      summary: Record that a dose has been taken now
      operationId: takeMedicationDose
      tags:
        - Medications
      security:
        - BearerAuth: []
      parameters:
        - name: medicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dose successfully recorded and next schedule returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TakenResponse'
        '401':
          description: Missing or invalid token
        '403':
          description: Forbidden - medication plan does not belong to the user
        '404':
          description: Active medication plan not found
        '500':
          description: Internal server error

  /api/sos/incidents:
    post:
      summary: Trigger a new SOS incident and alert emergency contacts
      operationId: postSOSIncident
      tags:
        - SOS
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SOSIncidentRequest'
      responses:
        '201':
          description: SOS incident successfully created and alerts sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SOSIncidentResponse'
        '400':
          description: Invalid request payload or coordinates validation failed
        '401':
          description: Missing, invalid, or expired JWT token
        '500':
          description: Internal server error

  /api/sos/incidents/{incidentId}/cancel:
    post:
      summary: Send a follow-up "all clear" notification and resolve the event
      operationId: cancelSOSIncident
      tags:
        - SOS
      security:
        - BearerAuth: []
      parameters:
        - name: incidentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cancellation processed and follow-up alert dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "cancellation request processed, all clear alert sent"
        '401':
          description: Missing, invalid, or expired JWT token
        '403':
          description: Forbidden - SOS incident belongs to another user
        '404':
          description: SOS incident not found
        '500':
          description: Internal server error

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthRequest:
      type: object
      required:
        - phoneNumber
        - password
      properties:
        phoneNumber:
          type: string
          description: E.164 biçimindeki telefon numarası
          example: "+905551234567"
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    UploadResponse:
      type: object
      properties:
        file_key:
          type: string
          example: 4a2b9f80-1234-5678-9abc-def012345678.png
        message:
          type: string
          example: file uploaded successfully

    RegisterRequest:
      type: object
      required:
        - phoneNumber
        - password
      properties:
        phoneNumber:
          type: string
          description: E.164 biçimindeki telefon numarası
          example: "+905551234567"
        password:
          type: string
          format: password
          minLength: 8
          example: secure-password

    RegisterResponse:
      type: object
      required:
        - id
        - phoneNumber
      properties:
        id:
          type: string
        phoneNumber:
          type: string

    VitalPacket:
      type: object
      required:
        - recordedAt
      properties:
        userId:
          type: string
          nullable: true
        heartRate:
          type: integer
          description: Kalp atış hızı (bpm)
          example: 72
        bloodOxygen:
          type: integer
          description: Kandaki oksijen oranı (SpO₂ yüzdesi)
          example: 98
        recordedAt:
          type: string
          format: date-time
        deviceSn:
          type: string
          example: "band-xyz-123"
        readingId:
          type: string
          example: "read-999"

    PatientProfile:
      type: object
      properties:
        birthDate:
          type: string
          format: date
          example: "1995-04-12"
        bloodType:
          type: string
          example: "A+"
        criticalFacts:
          type: object
          additionalProperties: true
          example:
            allergies:
              - penicillin
            chronicConditions:
              - asthma
        timezone:
          type: string
          example: "Europe/Istanbul"

    DocumentCatalog:
      type: object
      required:
        - id
        - kind
        - title
        - contentType
        - currentVersionId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [report, prescription]
        title:
          type: string
          example: "Kan Analiz Raporu"
        contentType:
          type: string
          example: "application/pdf"
        currentVersionId:
          type: string
          example: "v1.0"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MedicationCatalogItem:
      type: object
      required:
        - id
        - name
        - strength
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Parol"
        strength:
          type: string
          example: "500mg"

    CreateMedicationRequest:
      type: object
      required:
        - name
        - frequencyHours
      properties:
        name:
          type: string
          example: "Parol"
        strength:
          type: string
          example: "500mg"
        instructions:
          type: string
          example: "Günde 2 kez aç karnına"
        frequencyHours:
          type: integer
          enum: [6, 12, 24]
          example: 12
        prescriptionDocumentId:
          type: string
          format: uuid
          nullable: true

    MedicationResponse:
      type: object
      required:
        - id
        - name
        - frequencyHours
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        strength:
          type: string
        instructions:
          type: string
        frequencyHours:
          type: integer
        lastTakenAt:
          type: string
          format: date-time
          nullable: true
        nextScheduledFor:
          type: string
          format: date-time
          nullable: true

    TakenResponse:
      type: object
      required:
        - nextScheduledFor
      properties:
        nextScheduledFor:
          type: string
          format: date-time

    SOSIncidentRequest:
      type: object
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 41.0082
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 28.9784
        accuracyMeters:
          type: number
          format: double
          minimum: 0
          example: 15.5
        address:
          type: string
          example: "İstanbul, Türkiye"

    SOSIncidentResponse:
      type: object
      required:
        - id
        - patientId
        - status
        - startedAt
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        status:
          type: string
          example: "active"
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        accuracyMeters:
          type: number
          format: double
          nullable: true
        address:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time



