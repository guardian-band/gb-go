openapi: 3.0.3
info:
  title: Guardian Band API
  description: HTTP API for the Guardian Band application.
  version: 0.1.0

servers:
  - url: http://localhost:3000
    description: Local development server

paths:
  /api/register:
    post:
      summary: Register a user
      operationId: registerUser
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Invalid request
        '409':
          description: User already exists
        '500':
          description: Internal server error

  /api/login:
    post:
      summary: Log in a user
      operationId: loginUser
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: User successfully logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request
        '401':
          description: Invalid credentials

  /api/protected:
    get:
      summary: Sample protected endpoint requiring JWT
      operationId: getProtected
      tags:
        - Protected
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Access granted
          content:
            text/plain:
              schema:
                type: string
                example: Access granted to protected endpoint!
        '401':
          description: Missing, invalid, or expired JWT token

  /api/upload:
    post:
      summary: Upload a file to S3 / MinIO storage
      operationId: uploadFile
      tags:
        - Storage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          description: Invalid request or missing file
        '401':
          description: Missing, invalid, or expired JWT token
        '500':
          description: Internal server error or storage failure

  /api/vitals:
    post:
      summary: Store a vital packet in Redis
      operationId: storeVitals
      tags:
        - Vitals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VitalPacket'
      responses:
        '201':
          description: Vitals successfully recorded
        '400':
          description: Invalid vital data range or invalid payload
        '500':
          description: Internal server error or storage failure

  /api/vitals/{userId}/latest:
    get:
      summary: Retrieve the latest vitals record for a user
      operationId: getLatestVitals
      tags:
        - Vitals
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Vitals successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VitalPacket'
        '400':
          description: Invalid request
        '404':
          description: Vitals not found for this user
        '500':
          description: Internal server error or storage failure

  /api/profile:
    get:
      summary: Get the authenticated user's patient profile
      operationId: getProfile
      tags:
        - Profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientProfile'
        '401':
          description: Missing, invalid, or expired JWT token
        '404':
          description: Profile not found for this user
        '500':
          description: Internal server error
    put:
      summary: Create or update the authenticated user's patient profile
      operationId: putProfile
      tags:
        - Profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientProfile'
      responses:
        '200':
          description: Profile successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientProfile'
        '400':
          description: Invalid request or payload validations failed
        '401':
          description: Missing, invalid, or expired JWT token
        '500':
          description: Internal server error

  /api/documents:
    get:
      summary: Get the authenticated user's document catalog list
      operationId: getDocuments
      tags:
        - Documents
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of documents successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentCatalog'
        '401':
          description: Missing, invalid, or expired JWT token
        '500':
          description: Internal server error

  /api/documents/{documentId}:
    get:
      summary: Get detailed catalog metadata for a specific document
      operationId: getDocumentDetail
      tags:
        - Documents
      security:
        - BearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document catalog details successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentCatalog'
        '401':
          description: Missing, invalid, or expired JWT token
        '403':
          description: Forbidden - document does not belong to the user
        '404':
          description: Document not found
        '500':
          description: Internal server error

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthRequest:
      type: object
      required:
        - phoneNumber
        - password
      properties:
        phoneNumber:
          type: string
          description: E.164 biçimindeki telefon numarası
          example: "+905551234567"
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    UploadResponse:
      type: object
      properties:
        file_key:
          type: string
          example: 4a2b9f80-1234-5678-9abc-def012345678.png
        message:
          type: string
          example: file uploaded successfully

    RegisterRequest:
      type: object
      required:
        - phoneNumber
        - password
      properties:
        phoneNumber:
          type: string
          description: E.164 biçimindeki telefon numarası
          example: "+905551234567"
        password:
          type: string
          format: password
          minLength: 8
          example: secure-password

    RegisterResponse:
      type: object
      required:
        - id
        - phoneNumber
      properties:
        id:
          type: string
        phoneNumber:
          type: string

    VitalPacket:
      type: object
      required:
        - userId
        - heartRate
        - bloodOxygen
        - recordedAt
      properties:
        userId:
          type: string
        heartRate:
          type: integer
          description: Kalp atış hızı (bpm)
          example: 72
        bloodOxygen:
          type: integer
          description: Kandaki oksijen oranı (SpO₂ yüzdesi)
          example: 98
        recordedAt:
          type: string
          format: date-time

    PatientProfile:
      type: object
      properties:
        birthDate:
          type: string
          format: date
          example: "1995-04-12"
        bloodType:
          type: string
          example: "A+"
        criticalFacts:
          type: object
          additionalProperties: true
          example:
            allergies:
              - penicillin
            chronicConditions:
              - asthma
        timezone:
          type: string
          example: "Europe/Istanbul"

    DocumentCatalog:
      type: object
      required:
        - id
        - kind
        - title
        - contentType
        - currentVersionId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [report, prescription]
        title:
          type: string
          example: "Kan Analiz Raporu"
        contentType:
          type: string
          example: "application/pdf"
        currentVersionId:
          type: string
          example: "v1.0"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time



